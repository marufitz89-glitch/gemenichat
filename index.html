<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Chat</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d12;
      --sidebar: #10131a;
      --card: #151923;
      --border: #272c38;
      --text: #f4f5f7;
      --muted: #9299a8;
      --accent: #7c5cff;
      --accent2: #6246ea;
      --user: #252b38;
      --input: #171b24;
    }

    body.light {
      --bg: #f5f6fa;
      --sidebar: #ffffff;
      --card: #ffffff;
      --border: #e2e5eb;
      --text: #16181d;
      --muted: #6c7280;
      --user: #eceef3;
      --input: #ffffff;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      display: flex;
      overflow: hidden;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .sidebar {
      width: 260px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: .25s;
    }

    .logo {
      font-size: 21px;
      font-weight: 800;
      padding: 10px 8px 18px;
    }

    .logo span {
      color: var(--accent);
    }

    .new-chat {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 12px;
      padding: 12px;
      text-align: left;
    }

    .new-chat:hover {
      border-color: var(--accent);
    }

    .history {
      flex: 1;
      overflow-y: auto;
    }

    .history-title {
      color: var(--muted);
      font-size: 12px;
      margin: 12px 8px;
      text-transform: uppercase;
    }

    .history-item {
      padding: 10px;
      border-radius: 9px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    .history-item:hover {
      background: var(--card);
      color: var(--text);
    }

    .side-bottom {
      display: flex;
      gap: 8px;
    }

    .side-btn {
      flex: 1;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      border-radius: 10px;
      padding: 9px;
    }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 62px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .mobile-menu {
      display: none;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 23px;
    }

    .model {
      font-size: 14px;
      color: var(--muted);
    }

    .model strong {
      color: var(--text);
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 15px 150px;
    }

    .messages {
      width: min(850px, 100%);
      margin: auto;
    }

    .welcome {
      text-align: center;
      margin-top: 15vh;
    }

    .welcome-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      margin: 0 auto 18px;
      background: var(--accent);
      font-size: 27px;
    }

    .welcome h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .welcome p {
      color: var(--muted);
    }

    .message {
      display: flex;
      gap: 12px;
      margin: 22px 0;
      animation: appear .2s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      font-size: 14px;
      background: var(--card);
      border: 1px solid var(--border);
    }

    .user .avatar {
      background: var(--accent);
      border-color: var(--accent);
    }

    .bubble {
      flex: 1;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--user);
      border-radius: 14px;
      padding: 12px 15px;
    }

    .bubble pre {
      background: #090b0f;
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .bubble code {
      font-family: Consolas, monospace;
    }

    .bubble p {
      margin-bottom: 8px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .actions {
      margin-top: 7px;
      display: flex;
      gap: 7px;
    }

    .action-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 12px;
    }

    .action-btn:hover {
      color: var(--text);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      padding: 12px 0;
    }

    .typing i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1s infinite;
    }

    .typing i:nth-child(2) {
      animation-delay: .15s;
    }

    .typing i:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      0%, 60%, 100% {
        transform: translateY(0);
      }
      30% {
        transform: translateY(-5px);
      }
    }

    .composer-wrap {
      position: fixed;
      left: 260px;
      right: 0;
      bottom: 0;
      padding: 16px;
      background: linear-gradient(transparent, var(--bg) 25%);
    }

    .composer {
      width: min(850px, 100%);
      margin: auto;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 17px;
      padding: 9px;
      display: flex;
      align-items: flex-end;
      gap: 8px;
      box-shadow: 0 10px 35px rgba(0,0,0,.18);
    }

    textarea {
      flex: 1;
      min-height: 42px;
      max-height: 150px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 11px;
      font-size: 15px;
      line-height: 1.4;
    }

    .send {
      width: 43px;
      height: 43px;
      border: 0;
      border-radius: 12px;
      background: var(--accent);
      color: white;
      font-size: 18px;
    }

    .send:hover {
      background: var(--accent2);
    }

    .send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 700px) {
      .sidebar {
        position: fixed;
        z-index: 20;
        left: -270px;
        top: 0;
        bottom: 0;
      }

      .sidebar.open {
        left: 0;
      }

      .mobile-menu {
        display: block;
      }

      .composer-wrap {
        left: 0;
      }

      .topbar {
        padding: 0 14px;
      }

      .welcome h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar" id="sidebar">
    <div class="logo">Gemini<span>Chat</span></div>

    <button class="new-chat" onclick="newChat()">＋ New chat</button>

    <div class="history">
      <div class="history-title">Recent chats</div>
      <div id="historyList"></div>
    </div>

    <div class="side-bottom">
      <button class="side-btn" onclick="toggleTheme()">Theme</button>
      <button class="side-btn" onclick="clearHistory()">Clear</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      <div class="model">
        Model: <strong>Gemini 2.5 Flash-Lite</strong>
      </div>
      <div>AI</div>
    </header>

    <section class="chat" id="chat">
      <div class="messages" id="messages">

        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h1>How can I help you?</h1>
          <p>Ask anything and chat with Gemini.</p>
        </div>

      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea
          id="input"
          placeholder="Message Gemini..."
          autocomplete="off"
          rows="1"></textarea>

        <button class="send" id="send" type="submit">➤</button>
      </form>

      <div class="status">
        Gemini API • Free-tier model
      </div>
    </div>

  </main>

<script>
  /*
    IMPORTANT:
    After deploying your Render backend, replace this URL.

    Example:
    https://my-gemini-backend.onrender.com/api/chat
  */
  const API_URL = "https://YOUR-BACKEND-NAME.onrender.com/api/chat";

  const input = document.getElementById("input");
  const form = document.getElementById("form");
  const messages = document.getElementById("messages");
  const send = document.getElementById("send");
  const chat = document.getElementById("chat");
  const welcome = document.getElementById("welcome");
  const sidebar = document.getElementById("sidebar");
  const historyList = document.getElementById("historyList");

  let conversation = [];
  let savedChats = JSON.parse(localStorage.getItem("gemini_chats") || "[]");

  function escapeHTML(text) {
    return text
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function simpleMarkdown(text) {
    let html = escapeHTML(text);

    html = html.replace(
      /```([\s\S]*?)```/g,
      "<pre><code>$1</code></pre>"
    );

    html = html.replace(
      /\*\*(.*?)\*\*/g,
      "<strong>$1</strong>"
    );

    html = html.replace(
      /`([^`]+)`/g,
      "<code>$1</code>"
    );

    html = html.replace(/\n/g, "<br>");

    return html;
  }

  function scrollBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addMessage(role, text, temporary = false) {
    if (welcome) welcome.style.display = "none";

    const wrapper = document.createElement("div");
    wrapper.className = "message " + role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = role === "user" ? "U" : "✦";

    const content = document.createElement("div");
    content.className = "bubble";

    if (temporary) {
      content.innerHTML = `
        <div class="typing">
          <i></i><i></i><i></i>
        </div>
      `;
    } else {
      content.innerHTML = simpleMarkdown(text);

      if (role === "assistant") {
        const actions = document.createElement("div");
        actions.className = "actions";

        const copy = document.createElement("button");
        copy.className = "action-btn";
        copy.textContent = "Copy";

        copy.onclick = async () => {
          await navigator.clipboard.writeText(text);
          copy.textContent = "Copied";
          setTimeout(() => copy.textContent = "Copy", 1200);
        };

        actions.appendChild(copy);
        content.appendChild(actions);
      }
    }

    wrapper.appendChild(avatar);
    wrapper.appendChild(content);
    messages.appendChild(wrapper);

    scrollBottom();

    return wrapper;
  }

  function saveCurrentChat() {
    if (!conversation.length) return;

    const firstUser = conversation.find(x => x.role === "user");

    const title = firstUser
      ? firstUser.content.slice(0, 45)
      : "New chat";

    const chatData = {
      id: Date.now(),
      title,
      messages: conversation
    };

    savedChats.unshift(chatData);

    if (savedChats.length > 20) {
      savedChats = savedChats.slice(0, 20);
    }

    localStorage.setItem(
      "gemini_chats",
      JSON.stringify(savedChats)
    );

    renderHistory();
  }

  function renderHistory() {
    historyList.innerHTML = "";

    savedChats.forEach(chatItem => {
      const item = document.createElement("div");
      item.className = "history-item";
      item.textContent = chatItem.title;

      item.onclick = () => {
        conversation = [...chatItem.messages];

        messages.innerHTML = "";

        conversation.forEach(m => {
          addMessage(
            m.role === "user" ? "user" : "assistant",
            m.content
          );
        });

        sidebar.classList.remove("open");
      };

      historyList.appendChild(item);
    });
  }

  function newChat() {
    conversation = [];
    messages.innerHTML = `
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✦</div>
        <h1>How can I help you?</h1>
        <p>Ask anything and chat with Gemini.</p>
      </div>
    `;

    input.focus();
    sidebar.classList.remove("open");
  }

  function clearHistory() {
    savedChats = [];
    localStorage.removeItem("gemini_chats");
    renderHistory();
  }

  function toggleTheme() {
    document.body.classList.toggle("light");

    localStorage.setItem(
      "theme",
      document.body.classList.contains("light")
        ? "light"
        : "dark"
    );
  }

  function toggleSidebar() {
    sidebar.classList.toggle("open");
  }

  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
  }

  renderHistory();

  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height =
      Math.min(input.scrollHeight, 150) + "px";
  });

  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  form.addEventListener("submit", async e => {
    e.preventDefault();

    const text = input.value.trim();

    if (!text || send.disabled) return;

    if (API_URL.includes("YOUR-BACKEND-NAME")) {
      alert(
        "Please set your Render backend URL in index.html first."
      );
      return;
    }

    input.value = "";
    input.style.height = "auto";

    addMessage("user", text);

    conversation.push({
      role: "user",
      content: text
    });

    send.disabled = true;

    const loading = addMessage(
      "assistant",
      "",
      true
    );

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          messages: conversation
        })
      });

      const data = await response.json();

      loading.remove();

      if (!response.ok) {
        throw new Error(
          data.error || "Server error"
        );
      }

      const answer = data.reply || "No response.";

      addMessage("assistant", answer);

      conversation.push({
        role: "assistant",
        content: answer
      });

      saveCurrentChat();

    } catch (error) {
      loading.remove();

      addMessage(
        "assistant",
        "⚠️ Error: " + error.message
      );
    }

    send.disabled = false;
    input.focus();
  });
</script>

</body>
  </html>
